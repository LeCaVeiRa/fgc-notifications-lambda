AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  fgc-notifications-lambda - substitui o container fgc-notifications-api por duas funções
  Lambda .NET 8: EventProcessor (acionada por Event Source Mapping no Amazon MQ / RabbitMQ)
  e HistoryApi (GET /notifications via API Gateway, autorização Admin dentro da própria Lambda).
  Broker Amazon MQ e EventSourceMapping ficam em template-broker.yaml (ver esse arquivo) -
  não são suportados pelo LocalStack, então este template principal precisa continuar
  100% deployável localmente sem eles.

Parameters:
  JwtKey:
    Type: String
    NoEcho: true
    Description: Mesma chave HS256 simétrica usada por fgc-users-api/fgc-catalog-api (Jwt:Key).
  JwtIssuer:
    Type: String
    Default: Fgc.UsersAPI
  JwtAudience:
    Type: String
    Default: Fgc.CatalogAPI

Globals:
  Function:
    Runtime: dotnet8
    MemorySize: 256
    Timeout: 30

Resources:
  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FgcNotifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: Pk
          AttributeType: S
        - AttributeName: SentAtId
          AttributeType: S
      KeySchema:
        - AttributeName: Pk
          KeyType: HASH
        - AttributeName: SentAtId
          KeyType: RANGE

  EventProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/Fgc.Notifications.Lambda.EventProcessor/
      Handler: Fgc.Notifications.Lambda.EventProcessor::Fgc.Notifications.Lambda.EventProcessor.Function::FunctionHandler
      Environment:
        Variables:
          # Vazio em produção (usa a AWS real). `sam local invoke --env-vars` só consegue
          # sobrescrever variáveis já declaradas aqui - não injeta variáveis novas.
          DYNAMODB_LOCAL_ENDPOINT: ""
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref NotificationsTable

  HistoryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/Fgc.Notifications.Lambda.HistoryApi/
      Handler: Fgc.Notifications.Lambda.HistoryApi::Fgc.Notifications.Lambda.HistoryApi.Function::FunctionHandler
      Environment:
        Variables:
          JWT_KEY: !Ref JwtKey
          JWT_ISSUER: !Ref JwtIssuer
          JWT_AUDIENCE: !Ref JwtAudience
          DYNAMODB_LOCAL_ENDPOINT: ""
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NotificationsTable
      Events:
        HistoryGet:
          Type: HttpApi
          Properties:
            Path: /notifications
            Method: GET

Outputs:
  HistoryApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/notifications"
  EventProcessorFunctionArn:
    Description: Consumido por template-broker.yaml (EventSourceMapping.FunctionName).
    Value: !GetAtt EventProcessorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventProcessorFunctionArn"
  EventProcessorFunctionRoleName:
    Description: Consumido por template-broker.yaml (para anexar a policy secretsmanager:GetSecretValue).
    Value: !Ref EventProcessorFunctionRole
    Export:
      Name: !Sub "${AWS::StackName}-EventProcessorFunctionRoleName"
